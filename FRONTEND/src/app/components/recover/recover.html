<div class="d-flex justify-content-center align-items-center min-vh-100">
  <div class="card border-success mb-3 w-100 shadow" style="max-width: 550px;">
    <div class="card-header fs-3 text-center text-success py-3">Recuperar contraseña</div>
    <div class="card-body text-success p-5">

      <form [formGroup]="recoverForm" (ngSubmit)="handleRecover()">
        <div class="mb-4">
          <label for="exampleInputEmail1" class="form-label">Ingrese el correo registrado</label>
          <input type="email" class="form-control form-control-lg" id="exampleInputEmail1"
                 aria-describedby="emailHelp" formControlName="email">
          <div id="emailHelp" class="form-text">Sus datos están seguros.</div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-success btn-lg">Enviar</button>
        </div>
      </form>

      @if (mensaje()) {
        <div class="alert alert-info mt-3 mb-0">
          {{ mensaje() }}
        </div>
      }

    </div>
  </div>
</div>
