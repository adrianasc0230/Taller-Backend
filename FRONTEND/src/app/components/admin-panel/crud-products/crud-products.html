<button (click)="prepareCreate" class="btn btn-success">Nuevo producto</button>

@if (showForm()) {
    <div class="mt-3 card p-3 shadow-sm">
        <form (ngSubmit)="mode() === 'crear' ? createProduct() : updateProduct()" enctype="multipart/form-data">
            <div class="mb-2">
            <label class="form-label">Modelo:</label>
                <input type="text" class="form-control" [(ngModel)]     ="productoForm.modelo"
                name="modelo" required />
            </div>
            <div class="mb-2">
                <label class="form-label">Descripción:</label>
                <input type="text" class="form-control" [(ngModel)]="productoForm.descripcion"
                name="descripcion" required />
            </div>
            <div class="mb-2">
                <label class="form-label">Categoria:</label>
                <select class="form-select" [(ngModel)]="productoForm.categoria" name="categoria"
                required>
                <option value="" disabled>Selecciona una categoria</option>
                <option value="termos">Termos</option>
                <option value="sombrillas">Sombrillas</option>
                <option value="mugs">Mugs</option>
                <option value="joyeria">Joyeria</option>
                </select>
            </div>
            <div class="mb-2">
            <label class="form-label">Color:</label>
            <input type="text" class="form-control" [(ngModel)]="productoForm.color" name="color"
            required />
            </div>

</form>

        </form>
    </div>

}
