<div class="d-flex justify-content-center align-items-center min-vh-100">
  <div class="card border-success mb-3 tarjeta-login" style="max-width: 500px; width: 100%;">
    <div class="card-header fs-4 text-center">Registro AGROANIMA</div>
    <div class="card-body text-success p-4">

      <!-- Vista previa de la imagen (Implementación del paso 53) -->
      <div class="text-center mb-4">
        @if (imagePreview()) {
  <img
    [src]="imagePreview()"
    alt="Vista previa"
    class="rounded-circle border border-2 border-success object-fit-cover"
    style="width: 110px; height: 110px;">
} @else {
  <img
    src="http://localhost:3002/images/users/logindefault.png"
    alt="Avatar por defecto"
    class="rounded-circle border border-2 border-secondary object-fit-cover"
    style="width: 110px; height: 110px;">
}
      </div>

      <!-- Formulario conectado a Angular -->
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        
        <div class="mb-3">
          <label for="inputName" class="form-label">Nombre</label>
          <input type="text" class="form-control form-control-lg" id="inputName" formControlName="name" placeholder="Tu nombre completo">
        </div>

        <div class="mb-3">
          <label for="inputEmail" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control form-control-lg" id="inputEmail" formControlName="email" placeholder="ejemplo@correo.com">
        </div>

        <!-- Mantuve tu campo de teléfono, asegúrate de tenerlo en tu formBuilder en el .ts -->
        <div class="mb-3">
          <label for="inputTelefono" class="form-label">Teléfono</label>
          <input type="tel" class="form-control form-control-lg" id="inputTelefono" formControlName="telefono">
        </div>

        <div class="mb-3">
          <label for="inputPassword" class="form-label">Contraseña</label>
          <input type="password" class="form-control form-control-lg" id="inputPassword" formControlName="password">
        </div>

        <!-- Campo de Rol añadido según la guía -->
        <div class="mb-3">
          <label for="inputRol" class="form-label">Rol (Opcional)</label>
          <select class="form-select form-control-lg" id="inputRol" formControlName="rol">
            <option value="">Seleccionar rol (Por defecto: user)</option>
            <option value="user">Usuario (user)</option>
            <option value="admin">Administrador (admin)</option>
          </select>
        </div>

        <!-- Campo de Foto de perfil añadido según la guía -->
        <div class="mb-3">
          <label for="formFile" class="form-label">Foto de perfil (Opcional)</label>
          <input class="form-control form-control-lg" type="file" id="formFile" accept="image/*" (change)="onFileSelected($event)">
        </div>

        <div class="d-flex gap-2 mt-4"> 
          <!-- Botón actualizado a "Registrarse" como en la guía -->
          <button type="submit" class="btn btn-success btn-lg flex-fill">Registrarse</button>
        </div>

      </form>
    </div>
  </div>
</div>
